<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>რეგისტრაცია / შესვლა | DLGI Motors</title>

<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/index.css">
<link rel="stylesheet" href="../css/auth.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="container">
        <div class="row align-items-center justify-content-between">

            <div class="logo">
                <a href="../index.html">
                    <img class="logo11" src="../Images/DLGILOGO.jpeg" alt="DLGI Logo">
                </a>
            </div>

            <nav class="nav">
                <ul>
                    <li><a href="../index.html">მთავარი</a></li>
                    <li><a href="aboutus.html">ჩვენს შესახებ</a></li>
                    <li><a href="callus.html">გამოგვიძახე</a></li>
                    <li><a href="News.html">ვიდეოები</a></li>
                    <li><a href="map.html">ადგილმდებარეობა</a></li>
                    <li><a href="#" class="active">რეგისტრაცია/შესვლა</a></li>
                </ul>
            </nav>

        </div>
    </div>
</header>

<!-- AUTH SECTION -->
<section class="auth-section">
    <div class="auth-container">

        <!-- FORM BOX -->
        <div class="auth-box">

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="showForm('register')">რეგისტრაცია</button>
                <button class="tab-btn" onclick="showForm('login')">შესვლა</button>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="form active">
                <div class="row">
                    <input type="text" placeholder="სახელი" id="regName" required>
                    <input type="text" placeholder="გვარი" id="regSurname" required>
                </div>
                <input type="email" placeholder="იმეილი" id="regEmail" required>
                <input type="password" placeholder="პაროლი" id="regPassword" required>
                <input type="tel" placeholder="ტელეფონის ნომერი" id="regPhone" required>
                <input type="text" placeholder="მანქანის ნომერი მაგ:DL-123-GI" id="regCarNum" required>
                <div class="row">
                    <input type="text" placeholder="მარკა" id="regBrand" required>
                    <input type="text" placeholder="მოდელი" id="regModel" required>
                </div>

                <label>ძრავის მოცულობა</label>
                <select id="engine" required>
                    <option value="">აირჩიე</option>
                </select>

                <label>საწვავის ტიპი</label>
                <select id="fuel" required>
                    <option value="">აირჩიე</option>
                    <option>Petrol</option>
                    <option>Diesel</option>
                    <option>Hybrid</option>
                    <option>Electric</option>
                </select>

                <label>წელი</label>
                <select id="carYear" required>
                    <option value="">აირჩიე</option>
                </select>

                <button type="submit">რეგისტრაცია</button>
            </form>

            <!-- Login Form -->
            <form id="loginForm" class="form">
                <input type="email" placeholder="იმეილი" id="loginEmail" required>
                <input type="password" placeholder="პაროლი" id="loginPassword" required>
                <button type="submit">შესვლა</button>
                <p class="forgot-pass"><a href="#" onclick="showForm('reset')">პაროლის აღდგენა</a></p>
            </form>

            <!-- Password Reset Form -->
            <form id="resetForm" class="form">
                <input type="email" placeholder="შეიყვანეთ თქვენი იმეილი" id="resetEmail" required>
                <button type="submit">აღდგენა</button>
                <p class="back-login"><a href="#" onclick="showForm('login')">უკან დაბრუნება</a></p>
            </form>

        </div>

        <!-- IMAGE -->
        <div class="auth-image">
            <img src="../Images/photo9.jpg" alt="car image">
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
   <div class="container">
    <div class="row">

        <div class="footer-col">
            <h4>კომპანია</h4>
            <ul>
                <li><a href="aboutus.html">ჩვენს შესახებ</a></li>
                <li><a href="../index.html">მთავარი</a></li>
                <li><a href="map.html">ადგილმდებარეობა</a></li>
            </ul>
        </div>

        <div class="footer-col">
            <h4>გამოგვყევით</h4>
            <div class="social-links">
                <a href="https://www.facebook.com/DlgiGroupMotors"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/dlgigroupmotors/"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@dlgigroupmotors?lang=en-GB"><i class="fab fa-tiktok"></i></a>
            </div>

            <a href="https://wa.me/995598384888" target="_blank" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i> მოგვწერე
            </a>
        </div>

    </div>
   </div>
</footer>

<script src="../js/script.js"></script>
<script>
// ძრავის მოცულობა
const engineSelect = document.getElementById("engine");
for(let i=1;i<=80;i++){
    let value=(i/10).toFixed(1);
    let option=document.createElement("option");
    option.value=value;
    option.textContent=value;
    engineSelect.appendChild(option);
}

// წლები
const yearSelect = document.getElementById("carYear");
for(let y=1980;y<=2026;y++){
    let option=document.createElement("option");
    option.value=y;
    option.textContent=y;
    yearSelect.appendChild(option);
}

// Tabs switch
function showForm(form){
    const reg=document.getElementById("registerForm");
    const log=document.getElementById("loginForm");
    const reset=document.getElementById("resetForm");
    const btns=document.querySelectorAll(".tab-btn");

    reg.classList.remove("active");
    log.classList.remove("active");
    reset.classList.remove("active");
    btns.forEach(btn=>btn.classList.remove("active"));

    if(form==='register'){
        reg.classList.add("active");
        btns[0].classList.add("active");
    } else if(form==='login'){
        log.classList.add("active");
        btns[1].classList.add("active");
    } else if(form==='reset'){
        reset.classList.add("active");
    }
}
</script>
</body>
</html>
